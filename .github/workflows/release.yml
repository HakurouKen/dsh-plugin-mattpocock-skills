name: Release

# One run, start to finish: vendor upstream, decide the version, tag, publish.
#
# The version policy is a fact about the diff against the last `v*` tag:
#
#   patch  skill content changed
#   minor  skills were added or removed
#   major  the plugin's structure changed (patch, lib/, package.json shape)
#
# patch and minor publish automatically after the daily sync. major never does:
# a structural change can invalidate installed compositions, so it needs a human
# to dispatch this workflow with `mode: major`. The first publish was manual for
# the same reason.
#
# Syncing and releasing share a job on purpose. Splitting them needed a
# `workflow_run` handoff, which meant a second checkout, a second npm install
# and a second verification pass every day, including the days with nothing to
# do.

on:
  schedule:
    # Daily at 00:00 UTC. GitHub runs scheduled workflows on a best-effort
    # basis and may start this a few minutes late during peak load; a schedule
    # trigger only ever fires on the default branch.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          auto syncs upstream and follows the version policy. A bump forces that
          release without syncing. publish-current re-publishes the version
          already in package.json, for retrying a failed publish.
        type: choice
        options: [auto, publish-current, patch, minor, major]
        default: auto

permissions:
  contents: write
  # Required for npm provenance attestation.
  id-token: write

# A run mutates the branch and the registry; never let two overlap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Sync, version, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: main
          # Tags are the baseline the version policy compares against, and
          # `git describe` needs them to find the last release.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Deliberately no `registry-url`: it writes an `_authToken` line that
          # expands to empty without a token secret, and an empty credential can
          # shadow the OIDC exchange. The publish command names the registry.

      - name: Use an npm that supports trusted publishing
        run: |
          # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 20 ships npm 10.
          npm install -g npm@^11.21.1
          npm --version

      - name: Sync from upstream
        # Forced modes release what is already in the tree; they never pull new
        # content, so a manual release cannot surprise you with a sync.
        if: github.event_name == 'schedule' || inputs.mode == '' || inputs.mode == 'auto'
        run: node scripts/sync-skills.mjs

      - name: Verify the vendored tree and package contracts
        # A tree that breaks the catalog must never be tagged or published.
        run: node scripts/verify.mjs

      - name: Decide the next version
        id: plan
        env:
          MODE: ${{ inputs.mode || 'auto' }}
        run: |
          set -euo pipefail

          # Read one field out of the JSON plan without another dependency.
          field() {
            node -e '
              let raw = ""
              process.stdin.on("data", (c) => (raw += c)).on("end", () => {
                process.stdout.write(String(JSON.parse(raw)[process.argv[1]] ?? ""))
              })
            ' "$1"
          }

          plan=$(node scripts/release.mjs plan)
          planned=$(printf '%s' "$plan" | field bump)
          reason=$(printf '%s' "$plan" | field reason)
          echo "policy says: ${planned} — ${reason}"

          # The version as it stands now; a bump applied later produces a new one.
          version=$(node scripts/release.mjs version)
          release=true

          case "$MODE" in
            auto)
              case "$planned" in
                none) bump=none ;;
                initial)
                  echo "::notice::Not releasing: nothing has been published yet. Dispatch this workflow with mode=publish-current to publish ${version} deliberately."
                  bump=none
                  release=false
                  ;;
                major)
                  echo "::notice::Not releasing: the plugin structure changed. Dispatch this workflow with mode=major to publish it deliberately. Synced content is still committed."
                  bump=none
                  release=false
                  ;;
                *) bump="$planned" ;;
              esac
              ;;
            publish-current) bump=none ;;
            *) bump="$MODE" ;;
          esac

          name=$(node -p 'require("./package.json").name')
          publish=false
          tag_needed=false

          if [ "$release" = true ]; then
            if [ "$bump" != none ]; then
              # A bump always yields a version that is neither tagged nor on npm.
              publish=true
              tag_needed=true
            else
              tag="v${version}"
              if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
                if npm view "${name}@${version}" version >/dev/null 2>&1; then
                  echo "already released and published: ${tag}"
                else
                  # Tagged but absent from npm: a previous run tagged and then
                  # failed to publish. Publishing again is the retry.
                  echo "${tag} is tagged but missing from npm; publishing it"
                  publish=true
                fi
              else
                # Never tagged: the first publish of this version.
                publish=true
                tag_needed=true
              fi
            fi
          fi

          {
            echo "bump=${bump}"
            echo "publish=${publish}"
            echo "tag_needed=${tag_needed}"
          } >> "$GITHUB_OUTPUT"

      - name: Apply the bump
        if: steps.plan.outputs.bump != 'none'
        env:
          BUMP: ${{ steps.plan.outputs.bump }}
        run: |
          set -euo pipefail
          echo "bumped to $(node scripts/release.mjs apply "${BUMP}")"

      - name: Commit, tag, and push
        env:
          BUMP: ${{ steps.plan.outputs.bump }}
          TAG_NEEDED: ${{ steps.plan.outputs.tag_needed }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          version=$(node scripts/release.mjs version)
          tag="v${version}"
          committed=false

          # Vendored content first, so a release commit sits on top of the sync
          # it ships. `skills/` is the only generated path.
          git add -- skills
          if git diff --cached --quiet; then
            echo "no vendored changes"
          else
            upstream=$(node -p "require('./skills/PROVENANCE.json').upstream.version")
            count=$(node -p "require('./skills/PROVENANCE.json').skillCount")
            git commit -m "chore: sync upstream skills to ${upstream}" \
                       -m "Vendored ${count} skills from github.com/mattpocock/skills."
            committed=true
          fi

          if [ "$BUMP" != none ]; then
            git add -- package.json
            if git diff --cached --quiet; then
              echo "::error::expected a version bump but package.json is unchanged"
              exit 1
            fi
            git commit -m "chore(release): ${tag}"
            committed=true
          fi

          tagged=false
          if [ "$TAG_NEEDED" = true ] && ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            git tag -a "${tag}" -m "${tag}"
            tagged=true
          fi

          # One push for both, so the branch never shows a release commit
          # without the content it describes.
          if [ "$committed" = true ]; then git push origin main; fi
          if [ "$tagged" = true ]; then git push origin "${tag}"; fi
          echo "committed=${committed} tagged=${tagged} version=${version}"

      - name: Publish to npm
        if: steps.plan.outputs.publish == 'true'
        # No token secret: npm exchanges this job's OIDC identity for a
        # short-lived publish credential, and attaches a provenance statement
        # naming this repository and workflow.
        run: |
          set -euo pipefail
          name=$(node -p 'require("./package.json").name')
          version=$(node scripts/release.mjs version)
          echo "publishing ${name}@${version}"

          # Idempotent: a retry after a partial run must not fail here.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "already on npm, nothing to do"
            exit 0
          fi

          if npm publish --provenance --access public --registry https://registry.npmjs.org; then
            exit 0
          fi
          # A failed publish is not always a failed release: the version may have
          # landed while this run was deciding, or the earlier lookup may have
          # failed transiently. Ask the registry directly before failing.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::warning::npm publish reported an error, but ${name}@${version} is on the registry; treating it as published."
            exit 0
          fi
          echo "::error::npm publish failed. Trusted publishing must be configured on npmjs.com for ${name}: Settings -> Trusted Publisher -> GitHub Actions, repository owner HakurouKen, repository dsh-plugin-mattpocock-skills, workflow file release.yml, and publish permission enabled."
          exit 1

      - name: Report nothing to release
        if: steps.plan.outputs.publish == 'false'
        run: echo "Upstream may have moved, but no release was published for this run."
